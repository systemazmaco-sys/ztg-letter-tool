# Keeps the free-tier Supabase project from being paused for inactivity.
# Supabase pauses free projects after ~7 days without activity, so we ping
# the database every 3 days with a lightweight REST query.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 4 */3 * *"   # every 3 days at 04:17 UTC (07:47 Tehran)
  workflow_dispatch:          # allow manual run from the Actions tab

permissions:
  actions: write              # needed to keep this scheduled workflow enabled

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://fmjsfdfwjkaqxhyceeoq.supabase.co
      # Publishable (public) key - already exposed in index.html, safe to use here.
      SUPABASE_KEY: sb_publishable_pTHiPE2P1V347aaFG0sFtw_dwncaRZE
    steps:
      - name: Ping database (REST query)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/letters?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Supabase did not respond with 200 (last HTTP $code). The project may be paused - restore it from the Supabase dashboard."
          cat /tmp/resp.txt
          exit 1

      - name: Ping auth service
        if: always()
        run: |
          curl -s -o /dev/null -w "Auth health HTTP %{http_code}\n" \
            "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_KEY"

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow via API resets that timer.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" \
            && echo "Workflow kept enabled" || echo "::warning::Could not refresh workflow enable state"
